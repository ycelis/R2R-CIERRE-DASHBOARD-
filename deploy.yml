name: Deploy Dashboard a GitHub Pages

# Se activa cada vez que se hace push a la rama main
# Incluyendo cuando se sube un nuevo archivo en data/
on:
  push:
    branches:
      - main
  # También permite dispararlo manualmente desde la interfaz de GitHub
  workflow_dispatch:

# Permisos necesarios para escribir en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 3. Subir todo el contenido del repositorio como artefacto
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Sube todo el directorio raíz (index.html + data/cierre.xlsx)
          path: '.'

      # 4. Publicar en GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
